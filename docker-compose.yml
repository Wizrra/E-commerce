services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: 
    - .env
    depends_on:
    - redis
    ports:
    - "8000:8000"

  celery:
    build: .
    command: ["celery", "-A", "core", "worker", "-l", "info"]
    env_file: 
    - .env
    depends_on:
    - redis

  celery-beat:
    build: .
    command: ["celery", "-A", "core", "beat", "-l", "info"]
    env_file: 
    - .env
    depends_on:
    - redis

  redis:
    image: redis:7